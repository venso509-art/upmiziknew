name: Deploy UpMizik to Hostinger VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Frontend
        run: npm run build

      - name: Deploy to Hostinger VPS via SSH / Rsync
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_IP }}
          REMOTE_USER: 'root'
          TARGET: '/var/www/html/upmizik'
          EXCLUDE: '/node_modules/, /.git/'

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Phone Canvas -->
  <rect width="400" height="550" rx="24" fill="#0f172a"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="400" height="90" rx="24" fill="url(#headerGrad)"/>
  <rect x="0" y="60" width="400" height="30" fill="url(#headerGrad)"/>
  
  <!-- MonCash Logo / Brand -->
  <text x="200" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">MonCash</text>
  <text x="200" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#fecaca" text-anchor="middle">Resi Transfè Frè Enskripsyon Atis</text>

  <!-- Card Body -->
  <rect x="20" y="105" width="360" height="420" rx="16" fill="#1e293b" filter="url(#shadow)" stroke="#334155" stroke-width="1"/>

  <!-- Success Icon -->
  <circle cx="200" cy="155" r="32" fill="url(#checkGrad)"/>
  <path d="M188 155 l8 8 l16 -16" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Success Title -->
  <text x="200" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#10b981" text-anchor="middle">Tranzaksyon Konfime!</text>
  
  <!-- Amount -->
  <text x="200" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">650.00 HTG</text>
  <text x="200" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">Ekivalan: $4.99 USD</text>

  <!-- Divider Line -->
  <line x1="45" y1="285" x2="355" y2="285" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>

  <!-- Transaction Details -->
  <!-- Destinataire -->
  <text x="45" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Destinatè:</text>
  <text x="355" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="end">UpMizik Ofisyèl (Kont Atis)</text>

  <!-- Numero Compte -->
  <text x="45" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Nimewo Kont MonCash:</text>
  <text x="355" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="end">+509 3788-0000</text>

  <!-- Expediteur (Atis la) -->
  <text x="45" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Atis ki Peye a:</text>
  <text x="355" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="end">Ti Peterson Mizik</text>

  <!-- No Transaction -->
  <text x="45" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Ref Tranzaksyon:</text>
  <text x="355" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="end">MC-89421074-UPM</text>

  <!-- Date & Heure -->
  <text x="45" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Dat ak Lè:</text>
  <text x="355" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="end">01 Oktòb 2026, 11:14 AM</text>

  <!-- Frais -->
  <text x="45" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Frè Rezo:</text>
  <text x="355" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="end">0.00 HTG (Gratis)</text>

  <!-- Footer Tag -->
  <rect x="45" y="485" width="310" height="26" rx="6" fill="#0f172a"/>
  <text x="200" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">✓ Resi Otantifye Digicel MonCash Ayiti</text>
</svg>

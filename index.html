        <a href="#root" id="direct-enter-btn" onclick="var p=document.getElementById('pre-loader');if(p){p.style.opacity='0';setTimeout(function(){p.remove();},300);}" style="display:inline-flex;align-items:center;gap:8px;padding:9px 24px;border-radius:9999px;background:linear-gradient(90deg,#ef4444,#2563eb);color:#ffffff;font-size:13px;font-weight:800;text-decoration:none;box-shadow:0 6px 20px rgba(239,68,68,0.35);cursor:pointer;">

    <!-- Auto-Fade Pre-Loader Script: Ensures pre-loader fades out quickly and never blocks any visitor -->
    <script>
      (function() {
        var dismissed = false;
        function dismissPreloader() {
          if (dismissed) return;
          var pl = document.getElementById('pre-loader');
          if (pl) {
            pl.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
            pl.style.opacity = '0';
            pl.style.transform = 'scale(0.98)';
            setTimeout(function() {
              if (pl && pl.parentNode) {
                pl.parentNode.removeChild(pl);
              }
            }, 360);
          }
          dismissed = true;
        }

        // Auto dismiss after 900ms so users enter smoothly
        setTimeout(dismissPreloader, 900);
        window.addEventListener('load', function() {
          setTimeout(dismissPreloader, 200);
        });
      })();
    </script>

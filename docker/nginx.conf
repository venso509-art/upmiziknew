worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    server {
        listen 80;
        server_name _;

        root /var/www/html/dist;
        index index.html index.php;

        # 1. API PHP Routes (/backend/api/*)
        location ~ ^/backend/api/(.*)\.php$ {
            root /var/www/html;
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 300;
        }

        # 2. Uploads Fichye Odyo & Imaj (/backend/uploads/*)
        location ^~ /backend/uploads/ {
            alias /var/www/html/backend/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            add_header Access-Control-Allow-Origin "*";
            try_files $uri =404;
        }

        # 3. Frontend SPA Routing (React / Vite)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Sekirite: Bloke aksè dirèk nan fichye konfigirasyon
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Ring (Red on Left for Up, Blue on Right for Mizik) -->
    <linearGradient id="ringGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Up Red Gradient (Vibrant Red) -->
    <linearGradient id="upRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b4b" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="arrowFacetLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b78" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Mizik Blue Gradient (Vibrant Royal Blue) -->
    <linearGradient id="mizikBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Play Button Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Outer Gradient Ring (Red & Blue) -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#ringGrad)" stroke-width="12" />

  <!-- Left Audio Sound Wave Bars (Red Tint) -->
  <g fill="#ef4444" opacity="0.6">
    <rect x="42" y="240" width="4" height="20" rx="2" />
    <rect x="50" y="230" width="4" height="40" rx="2" />
    <rect x="58" y="222" width="4" height="56" rx="2" />
    <rect x="66" y="232" width="4" height="36" rx="2" />
    <rect x="74" y="242" width="4" height="16" rx="2" />
  </g>

  <!-- Right Audio Broadcast Waves (Blue Tint) -->
  <g stroke="#3b82f6" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.65">
    <path d="M 432 328 A 20 20 0 0 1 444 346" />
    <path d="M 438 320 A 32 32 0 0 1 454 352" />
  </g>

  <!-- Main Center Logo Group -->
  <g filter="url(#subtleShadow)">
    
    <!-- 1. "UP" SECTION (RED / WOUJ) -->
    <g transform="translate(75, 125)">
      <!-- 'U' Outer Body in RED -->
      <path d="M 15 70 L 15 110 C 15 160 40 180 85 180 C 120 180 145 160 148 115 L 148 70 L 122 70 L 122 110 C 120 145 105 156 85 156 C 62 156 42 145 42 110 L 42 70 Z" 
            fill="url(#upRedGrad)" />

      <!-- Inner 3D Ascending Arrow (Bright Red) -->
      <g>
        <!-- Arrow Base Stem -->
        <path d="M 68 60 L 68 135 L 94 135 L 94 60 Z" fill="#b91c1c" />
        <!-- Arrow Left Facet (Light Red) -->
        <path d="M 81 5 L 44 64 L 81 64 Z" fill="url(#arrowFacetLight)" />
        <!-- Arrow Right Facet (Deep Red) -->
        <path d="M 81 5 L 118 64 L 81 64 Z" fill="#991b1b" />
      </g>

      <!-- Play Button in 'U' Bowl -->
      <g transform="translate(32, 70)">
        <polygon points="12,10 46,30 12,50" fill="url(#playGrad)" stroke="#b91c1c" stroke-width="3" stroke-linejoin="round" />
        <polygon points="17,17 40,30 17,43" fill="#ffffff" opacity="0.4" />
      </g>
    </g>

    <!-- 'p' in RED (completing "Up" in Red) -->
    <g transform="translate(175, 205)">
      <path d="M 2 7 L 26 7 L 26 24 C 33 10 46 4 60 4 C 82 4 98 20 98 48 C 98 76 81 92 59 92 C 45 92 33 85 26 72 L 26 112 L 2 112 Z M 26 48 C 26 63 36 73 50 73 C 64 73 74 63 74 48 C 74 33 64 23 50 23 C 36 23 26 33 26 48 Z" 
            fill="url(#upRedGrad)" />

      <!-- 2. "MIZIK" SECTION (BLUE / BLEU) -->
      <g transform="translate(86, 0)">
        <!-- 'M' in Royal Blue -->
        <path d="M 6 88 L 6 6 L 30 6 L 46 54 L 62 6 L 86 6 L 86 88 L 65 88 L 65 34 L 52 74 L 40 74 L 27 34 L 27 88 Z" fill="url(#mizikBlueGrad)" />
        <!-- 'i' -->
        <rect x="94" y="6" width="19" height="19" rx="3" fill="#3b82f6" />
        <rect x="94" y="32" width="19" height="56" rx="2" fill="#2563eb" />
        <!-- 'z' -->
        <path d="M 122 32 L 160 32 L 160 48 L 138 72 L 162 72 L 162 88 L 120 88 L 120 73 L 143 48 L 122 48 Z" fill="url(#mizikBlueGrad)" />
        <!-- 'i' -->
        <rect x="171" y="6" width="19" height="19" rx="3" fill="#3b82f6" />
        <rect x="171" y="32" width="19" height="56" rx="2" fill="#2563eb" />
        <!-- 'k' -->
        <path d="M 199 6 L 219 6 L 219 46 L 243 32 L 268 32 L 241 57 L 270 88 L 244 88 L 226 68 L 219 75 L 219 88 L 199 88 Z" fill="url(#mizikBlueGrad)" />
      </g>
    </g>

    <!-- Underline Dual Stripes (Left: RED for Up, Right: BLUE for Mizik) -->
    <g transform="translate(75, 324)">
      <!-- Red Double Line on Left under "Up" -->
      <rect x="0" y="0" width="105" height="5" rx="2.5" fill="#ef4444" />
      <rect x="0" y="9" width="105" height="5" rx="2.5" fill="#dc2626" />

      <!-- Blue Double Line on Right under "Mizik" -->
      <rect x="118" y="0" width="225" height="5" rx="2.5" fill="#3b82f6" />
      <rect x="118" y="9" width="225" height="5" rx="2.5" fill="#1d4ed8" />
    </g>

    <!-- Tagline: "Platfòm mizik 100% ayisyen" -->
    <text x="250" y="368" 
          text-anchor="middle" 
          font-family="'Cabinet Grotesk', 'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-weight="800" 
          font-size="22" 
          fill="#f8fafc" 
          letter-spacing="-0.2">
      Platfòm Mizik Ayisyen &amp; Sipò Dirèk
    </text>
  </g>
</svg>
